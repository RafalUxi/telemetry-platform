# Mosquitto 2.x: without an explicit listener the broker only binds to localhost
# inside the container, which is unreachable from the host.
listener 1883

# Open broker, development only. Per-device credentials and ACL land here in step 3.
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/

log_dest stdout
